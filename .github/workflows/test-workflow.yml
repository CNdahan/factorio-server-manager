on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*.*'
  pull_request:
    branches:
      - '**'
env:
  factorio_password: ${{ secrets.FACTORIO_PASSWORD }}
  factorio_username: ${{ secrets.FACTORIO_USERNAME }}
  FSM_MODPACK_DIR: 'dev_pack'
  FSM_DIR: '../'
  FSM_CONF: '../../conf.json.example'
jobs:
  test-npm:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
      - run: make app/bundle
  test-go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.18', '1.20', '1']
    runs-on: ${{ matrix.os }}
    name: test-go ${{ matrix.go }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v2
      - name: Setup go
        uses: actions/setup-go@v2
        with:
          go-version: ${{ matrix.go }}
      - if: contains(matrix.os, 'ubuntu')
        run: |
          cd src
          if [[ -z "$factorio_password" ]]; then
            echo "run only short tests"
            go test ./... -v -test.short
          else
            echo "run full test suit"
            go test ./... -v
          fi
      - if: contains(matrix.os, 'windows')
        run: |
          cd src
          if ([Environment]::GetEnvironmentVariable('factorio_password', 'Machine')) {
            echo "run full test suit"
            go test ./... -v
          } else {
            echo "run only short tests"
            go test ./... -v "-test.short"
          }
  build-release:
    needs: [test-npm, test-go]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
      - uses: actions/setup-go@v2
      - name: Install mingw-w64 for Windows cross-compile
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib gcc-mingw-w64 g++-mingw-w64
      - name: Build Linux & Windows release packages
        run: make gen_release
      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: factorio-server-manager-linux
          path: build/factorio-server-manager-linux.zip
      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: factorio-server-manager-windows
          path: build/factorio-server-manager-windows.zip
      - name: Create/Update GitHub Release (latest)
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Latest Build"
          body: |
            > ⚡ 自动构建于每次 push，随 `develop` 分支更新。

            | 平台 | 文件 |
            |------|------|
            | 🐧 Linux (amd64) | `factorio-server-manager-linux.zip` |
            | 🪟 Windows (amd64) | `factorio-server-manager-windows.zip` |

            ### 使用方法
            1. 下载对应平台的 zip 包
            2. 解压到你的 Factorio 服务器目录
            3. 编辑 `conf.json` 配置文件
            4. 运行 `./factorio-server-manager`（Linux）或 `factorio-server-manager.exe`（Windows）
          artifacts: "build/factorio-server-manager-linux.zip,build/factorio-server-manager-windows.zip"
          allowUpdates: true
          generateReleaseNotes: false
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
